appId: com.vtriot.ccpit
productName: CCPIT
copyright: Copyright © 2026 VTRiot
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CONTRIBUTING.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!dev.bat'
  - '!*.lnk'
  # バックアップ類は配布物に絶対に入れない（.bak は redaction 前原本・旧設定を含み得る leak 経路）
  - '!_bak_preserve'
  - '!**/*.bak*'
  # dashboard-ja は extraResources で asar の外へ実ファイルとして置く。asarUnpack:resources/** の
  # 対象に入ると asar 内にも同じ実体が入り二重同梱になるため、asar 側からは明示的に外す。
  # （`node <path>` 相当の spawn には実ファイルパスが要る＝asar 内では起動できない）
  - '!resources/dashboard-ja/**'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/splash.html
    to: splash.html
  - from: resources/Logo.png
    to: Logo.png
  - from: golden
    to: golden
    filter:
      - '**/*'
      - '!**/*.bak*'
  # 日本語ダッシュボード（serve-ja）の同梱。golden/ には置かない — golden は deploy() が
  # ~/.claude/ へ配る正本であり、配らないペイロードを混ぜると「deploy は 3 ルートしか走査しない」
  # という否定的性質に依存することになる（将来の一括配備改修で全ユーザーへ撒かれる事故の芽）。
  - from: resources/dashboard-ja
    to: dashboard-ja
    filter:
      - '**/*'
      - '!**/*.bak*'
win:
  executableName: CCPIT
  icon: build/icon.ico
nsis:
  artifactName: CCPIT-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  installerLanguages:
    - en_US
    - ja_JP
  displayLanguageSelector: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
